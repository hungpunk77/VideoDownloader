[package]
name = "videodownloader"
version = "2.3.0"
description = "VideoDownloader 2.3 — 100% Rust native desktop video, music & album downloader with multi-platform search (YouTube, YT Music, Bandcamp, Dailymotion, Videa, ok.ru), powered by yt-dlp and ffmpeg"
authors = ["VideoDownloader"]
edition = "2021"

[[bin]]
name = "videodownloader"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
arboard = "3"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
